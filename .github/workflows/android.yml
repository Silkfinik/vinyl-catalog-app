name: Android CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS != '' }}

    steps:
    - uses: actions/checkout@v4
    
    - name: set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
        
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Run Unit Tests
      run: ./gradlew testDebugUnitTest

    - name: Build AndroidTest APK
      run: ./gradlew assembleDebugAndroidTest

    - name: Authenticate to Google Cloud
      if: ${{ env.HAS_GCP_CREDENTIALS == 'true' }}
      uses: google-github-actions/auth@v2
      with:
        credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

    - name: Set up Cloud SDK
      if: ${{ env.HAS_GCP_CREDENTIALS == 'true' }}
      uses: google-github-actions/setup-gcloud@v2

    - name: Run UI tests on Firebase Test Lab
      if: ${{ env.HAS_GCP_CREDENTIALS == 'true' }}
      run: >
        gcloud firebase test android run
        --type instrumentation
        --app app/build/outputs/apk/debug/app-debug.apk
        --test app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
        --device model=Pixel3,version=30,locale=en,orientation=portrait

    - name: Build Release APK
      run: ./gradlew assembleRelease
      
    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: vinyl-catalog-release
        path: app/build/outputs/apk/release/app-release-unsigned.apk
